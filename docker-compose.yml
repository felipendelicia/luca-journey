# Postgres ya NO vive acá: corre como instancia compartida en `../shared-postgres`
# (red Docker externa `shared-db`). Antes de levantar esto, subí shared-postgres.
# Ver shared-postgres/README.md.

services:
  api:
    build: ./api
    image: luca-journey-api:latest   # tag fijo: permite buildear en otra máquina y cargar la imagen en la Pi (sin rebuild)
    restart: unless-stopped
    environment:
      # Dev usa el default (luca:luca, sin SSL). En la Pi el .env define DATABASE_URL con
      # password fuerte + `?sslmode=no-verify` (el Postgres compartido exige TLS -hostssl-, pero
      # node-postgres trata `require` como verify-full y el alias interno `postgres` no matchea el
      # cert de poke.servegame.com → usar `no-verify`: cifra sin verificar. Ver shared-postgres/README.md).
      DATABASE_URL: ${DATABASE_URL:-postgres://luca:luca@postgres:5432/luca}   # `postgres` = alias en shared-db
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: "${API_PORT:-3000}"
      # TLS app-level (deploy sin reverse proxy): si se setean, la API sirve HTTPS.
      # El cert se monta vía docker-compose.override.yml en el server. En dev quedan vacíos.
      TLS_CERT: "${TLS_CERT:-}"
      TLS_KEY: "${TLS_KEY:-}"
    ports:
      - "${API_PUBLISH:-3000:3000}"
    networks:
      - shared-db

networks:
  shared-db:
    external: true
