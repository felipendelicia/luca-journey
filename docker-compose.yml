services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: luca
      POSTGRES_PASSWORD: luca
      POSTGRES_DB: luca
    ports:
      - "5433:5432"   # 5433 host para no chocar con un postgres local
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luca"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    image: luca-journey-api:latest   # tag fijo: permite buildear en otra máquina y cargar la imagen en la Pi (sin rebuild)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://luca:luca@db:5432/luca
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: "${API_PORT:-3000}"
      # TLS app-level (deploy sin reverse proxy): si se setean, la API sirve HTTPS.
      # El cert se monta vía docker-compose.override.yml en el server. En dev quedan vacíos.
      TLS_CERT: "${TLS_CERT:-}"
      TLS_KEY: "${TLS_KEY:-}"
    ports:
      - "${API_PUBLISH:-3000:3000}"

volumes:
  dbdata:
