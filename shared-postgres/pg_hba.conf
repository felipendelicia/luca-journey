# pg_hba para la instancia compartida EXPUESTA a internet.
# Regla dura: TODA conexión TCP exige SSL (hostssl) + password scram-sha-256.
# El socket local queda en trust: es solo para mantenimiento vía `docker exec psql`
# (quien entra al contenedor ya es privilegiado).
#
# No se filtra por IP a propósito: el proxy de Docker enmascara el origen real de las
# conexiones publicadas, así que interno y externo son indistinguibles por dirección.
# La defensa es TLS + passwords fuertes por rol (ver docs/.../shared-postgres-expuesto).
#
# TYPE     DATABASE  USER  ADDRESS      METHOD
local      all       all                trust
hostssl    all       all   0.0.0.0/0    scram-sha-256
hostssl    all       all   ::/0         scram-sha-256
