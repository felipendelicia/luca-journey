<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Pokédex Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="cabecera">
        <a href="{{ url_for('index') }}" class="logo">🔴⚪ Pokédex Web</a>
        <nav>
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('agregar') }}">➕ Agregar</a>
        </nav>
    </header>

    <main class="contenido">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <p>Hecho con 🐍 Python + Flask — Curso de Python con Pokémon (Semana 12)</p>
    </footer>
</body>
</html>
