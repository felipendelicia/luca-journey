[pytest]
# Configuración global de pytest para el curso.
# Busca tests en todas las carpetas de semanas y proyectos.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -ra muestra un resumen de los tests que no pasaron al final.
# --import-mode=importlib permite que varias semanas tengan archivos con el
# mismo nombre (test_ejercicios.py, interactivo.py, etc.) sin chocar.
addopts = -ra --import-mode=importlib
testpaths =
    liga
    semana-01-linux-fundamentos
    semana-02-linux-intermedio
    semana-03-python-introduccion
    semana-04-python-control-de-flujo
    semana-05-python-funciones
    semana-06-python-listas-y-colecciones
    semana-07-python-cadenas-y-archivos
    semana-git-control-de-versiones
    semana-08-python-poo-introduccion
    semana-09-python-poo-avanzado
    semana-10-python-modulos-y-pip
    semana-11-python-proyecto-integrador
    semana-12-python-proyecto-final
    proyectos
