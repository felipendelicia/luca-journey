[pytest]
# Configuración global de pytest para el curso.
# Busca tests en todas las carpetas de semanas y proyectos.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -ra muestra un resumen de los tests que no pasaron al final.
# --import-mode=importlib permite que varias semanas tengan archivos con el
# mismo nombre (test_ejercicios.py, interactivo.py, etc.) sin chocar.
addopts = -ra --import-mode=importlib
testpaths =
    liga
    combates
    curso
    proyectos
